# Abhängigkeits-Updates (docs/unternehmensstandard.md, Abschnitt Sicherheit).
# Wöchentlich, gruppiert, höchstens zwei offene PRs je Ökosystem. Dependabot-PRs laufen durch
# den Pflicht-Check "Prüfen" und werden nicht automatisch gemergt; jeder Merge nach main geht live.
# JavaScript-Pakete: Ökosystem "bun", weil bun.lock das Lockfile ist. Mit "npm" bliebe bun.lock
# unverändert und `bun install --frozen-lockfile` in der CI schlüge fehl.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    groups:
      # Kleine Updates gesammelt in einem PR; Hauptversionen einzeln, weil sie Prüfung brauchen.
      klein:
        update-types: ["minor", "patch"]
