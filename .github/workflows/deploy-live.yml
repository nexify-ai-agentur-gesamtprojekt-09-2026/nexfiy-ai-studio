# Auslieferung von www.nexifyai.de (Cloudflare Worker nexfiy-ai-studio) mit menschlicher Freigabe.
# Startet nur von Hand (Actions -> "Deploy live" -> "Run workflow") und nur von main aus.
# Job "aufloesen" (ohne Environment, ohne Secrets) legt den auszuliefernden Commit als festen SHA
# aus der main-Historie fest und zeigt ihn in der Zusammenfassung. Job "deploy" wartet auf die
# Freigabe im Environment "production" (Required reviewers) und baut/testet/liefert genau diesen
# SHA aus. Ein Zweig, der sich während des Wartens ändert, kann so nicht mehr ausgeliefert werden.
# Das Deploy-Werkzeug (tools/deploy-live.sh) kommt immer aus dem Workflow-Commit (github.sha,
# main-Kopf beim Start) unter werkzeug/; gebaut wird nur der Anwendungsstand unter app/. So läuft
# auch ein Rückweg auf einen älteren main-Commit mit dem aktuellen, CI-fähigen Skript.
# Die Deploy-Logik liegt ausschließlich in tools/deploy-live.sh (Server und CI prüfen gleich).
# Einrichtung und Rückweg: docs/auslieferung.md
name: Deploy live

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "main oder ein vollständiger 40-stelliger Commit-SHA aus der main-Historie (Rollback)"
        required: true
        default: main
        type: string
      dry_run:
        description: "Nur prüfen (wrangler deploy --dry-run), nichts ausliefern"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  aufloesen:
    name: Commit festlegen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # Action-Versionen per Commit-SHA gepinnt; SHA = Tag laut `git ls-remote --tags` der offiziellen Repos (2026-11-22).
      - name: Checkout main (volle Historie)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Eingabe auf SHA aus der main-Historie auflösen
        id: sha
        env:
          EINGABE: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ "$EINGABE" = "main" ]; then
            sha="$(git rev-parse --verify 'origin/main^{commit}')"
          elif printf '%s' "$EINGABE" | grep -Eqx '[0-9a-f]{40}'; then
            if ! sha="$(git rev-parse --verify --quiet "${EINGABE}^{commit}")"; then
              echo "::error::Commit $EINGABE existiert nicht im Repository."
              exit 1
            fi
          else
            echo "::error::Eingabe ref muss 'main' oder ein vollständiger 40-stelliger Commit-SHA (Kleinbuchstaben) sein."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::Commit $sha gehört nicht zur Historie von main; keine Auslieferung."
            exit 1
          fi
          {
            echo "## Auszuliefernder Stand"
            echo ""
            echo "| Feld | Wert |"
            echo "| --- | --- |"
            echo "| Eingabe | \`$EINGABE\` |"
            echo "| Commit | \`$sha\` |"
            feld() { git log -1 --format="$1" "$sha" | sed 's/|/\\|/g'; }
            echo "| Betreff | $(feld %s) |"
            echo "| Autor | $(feld %an) |"
            echo "| Datum | $(feld %cI) |"
            if [ "$sha" != "$(git rev-parse origin/main)" ]; then
              echo ""
              echo "**Achtung:** älterer main-Commit (Rollback), nicht der aktuelle Stand von main."
            fi
            echo ""
            echo "Freigeben nur, wenn dieser Commit ausgeliefert werden soll."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Auszuliefern: $sha"

  deploy:
    name: Prüfen, bauen, ausliefern
    needs: aufloesen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://www.nexifyai.de
    steps:
      - name: Checkout Deploy-Werkzeug (Workflow-Commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: werkzeug
          persist-credentials: false

      - name: Checkout Anwendungsstand (festgelegter Commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.aufloesen.outputs.sha }}
          path: app
          persist-credentials: false

      - name: Ausgecheckte Commits prüfen
        env:
          SOLL: ${{ needs.aufloesen.outputs.sha }}
          WERKZEUG_SOLL: ${{ github.sha }}
        run: |
          ist="$(git -C app rev-parse HEAD)"
          if [ -z "$SOLL" ] || [ "$ist" != "$SOLL" ]; then
            echo "::error::Anwendung: ausgecheckt ist $ist, festgelegt war ${SOLL:-leer}; Abbruch."
            exit 1
          fi
          werkzeug="$(git -C werkzeug rev-parse HEAD)"
          if [ "$werkzeug" != "$WERKZEUG_SOLL" ]; then
            echo "::error::Werkzeug: ausgecheckt ist $werkzeug, erwartet $WERKZEUG_SOLL; Abbruch."
            exit 1
          fi
          echo "Anwendung: $ist"
          echo "Werkzeug:  $werkzeug"

      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Bun einrichten
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Abhängigkeiten installieren
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Typprüfung
        working-directory: app
        run: npx tsc --noEmit

      - name: Tests (Quellen)
        working-directory: app
        run: npm test

      - name: Build
        working-directory: app
        run: npm run build

      - name: Tests (mit Build-Ausgabe)
        working-directory: app
        run: npm test

      - name: Ausliefern
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_HOST: github-actions
          # Werkzeug aus werkzeug/, ausgeliefert wird das oben gebaute und getestete app/.output/.
          DEPLOY_APP_DIR: ${{ github.workspace }}/app
          DEPLOY_SKIP_BUILD: "1"
          # Wrangler ist keine Projektabhängigkeit; Version fest (npm, veröffentlicht 2026-11-05).
          WRANGLER_VERSION: "4.158.0"
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            werkzeug/tools/deploy-live.sh --dry-run
          else
            werkzeug/tools/deploy-live.sh
          fi
